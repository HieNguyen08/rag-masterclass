name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-docs.txt
      - name: Configure git
        run: |
          git config user.name "Nguyen Minh Hieu"
          git config user.email "nguyenminhhieu080203@gmail.com"
      # build --strict rồi đẩy thư mục site/ sang nhánh gh-pages
      - run: mkdocs gh-deploy --strict --force --no-history
