   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', sans-serif, 'Noto Sans CJK JP'; text-anchor: start; fill: #1b1b1a" x="415.463226" y="130.033726" transform="rotate(-0 415.463226 130.033726)">SE = −(0.6 ln 0.6 + 2·0.2 ln 0.2) ≈ 0.950</text>
