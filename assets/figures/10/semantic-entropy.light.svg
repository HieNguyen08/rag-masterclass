   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', sans-serif, 'Noto Sans CJK JP'; text-anchor: start; fill: #1b1b1a" x="376.443871" y="61.749504" transform="rotate(-0 376.443871 61.749504)">SE = 0</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', sans-serif, 'Noto Sans CJK JP'; text-anchor: start; fill: #1b1b1a" x="15.514839" y="129.981421" transform="rotate(-0 15.514839 129.981421)">3 cụm: 3 · 1 · 1</text>
